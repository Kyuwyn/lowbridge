formulas:
  - name: high_water
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "high_water[id] = max(high_water_prev[id], held[id]), once per unit completion (deduct inputs, add outputs, clamp, then update); high_water_prev starts at min(start, effective cap)"
    variables: [high_water_prev, held]
    output: "0 to 10^9; never decreases within a run; starts at min(start[id], effective cap); held never exceeds it; an ingredient is held 0 or 1 (clamped by #3)"
    referenced_by: []
  - name: atom_met
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "reached(id, n) = high_water[id] >= n; committed() = committed_method != none; forged(realm) = realm in forged_realms"
    variables: [high_water, n, committed_method, forged_realms]
    output: "bool; monotone false to true"
    referenced_by: []
  - name: gate_met
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "true if absent, else AND of atom_met over the gate"
    variables: [atom_met]
    output: "bool; monotone"
    referenced_by: []
  - name: shortfall
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "shortfall(id, n) = n - held[id] for each unmet reached atom"
    variables: [n, held]
    output: "1 to n"
    referenced_by: []
  - name: div_floor
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "largest integer q with q * d <= a; d >= 1"
    variables: [a, d]
    output: "exact integer, rounds toward minus infinity; d <= 0 throws"
    referenced_by: [design/gdd/forge-and-proving.md]
  - name: bp_of
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "div_floor(x * b, 10000)"
    variables: [x, b]
    output: "exact while |x * b| <= 2^53 - 1"
    referenced_by: []
  - name: record_state
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "hidden if reveal unmet; waiting if no commit; withdrawn if disabled in committed set; actionable if need met; else waiting"
    variables: [reveal, need, committed_method, enabled]
    output: "hidden | waiting | withdrawn | actionable; derived, never saved"
    referenced_by: []
  - name: method_change_set
    status: active
    source: design/gdd/content-records-and-schema.md
    expression: "changed(m) = set of (target, field, key?) over m.patches; output differs from input exactly there"
    variables: [patches]
    output: "0 to |patches| triples"
    referenced_by: [design/gdd/methods.md]
  - name: op_result
    status: active
    source: design/gdd/modifier-pipeline-and-recompute.md
    expression: "set gives x; add gives v + x; scale_bp gives bp_of(v, x)"
    variables: [op, v, x]
    output: "safe integer; inside the row's range only after the stage clamp"
    referenced_by: []
  - name: stage_apply
    status: active
    source: design/gdd/modifier-pipeline-and-recompute.md
    expression: "one entry gives op_result(op, v, operand); 1 to 16 add entries with distinct sources give v + sum of operands; no entries give v"
    variables: [v, entries]
    output: "abs value at most 17 * B before the clamp (B = row's largest absolute bound)"
    referenced_by: []
  - name: stage_clamp
    status: active
    source: design/gdd/modifier-pipeline-and-recompute.md
    expression: "min(max(v, lo), hi) over the row's interval, once per stage, only on values the Foundation or tending stage touched"
    variables: [v, lo, hi]
    output: "lo to hi; a changed value adds a clamp step to its trail"
    referenced_by: []
  - name: effective_value
    status: active
    source: design/gdd/modifier-pipeline-and-recompute.md
    expression: "clamp_T(stage_apply(clamp_F(stage_apply(v_method, F)), T)); method, then Foundation, then tending; pure in (frozen set, F, T)"
    variables: [v_method, F, T]
    output: "the row's range; for a sealInput row tended equals untended"
    referenced_by: []
  - name: trail_replay
    status: active
    source: design/gdd/modifier-pipeline-and-recompute.md
    expression: "fold steps from base with op_result (a clamp step takes its result); must equal final"
    variables: [base, steps]
    output: "equals final; 0 to 35 steps"
    referenced_by: []
  - name: scale_product_bound
    status: active
    source: design/gdd/modifier-pipeline-and-recompute.md
    expression: "max_abs(row) * SCALE_BP_MAX <= 2^53 - 1 for contrib, inputs, outputs, duration, cap"
    variables: [max_abs, scale_bp_operand_max]
    output: "true; largest product 10^14"
  - name: combat_life_start
    status: active
    source: design/gdd/combat-resolver.md
    expression: "max(1, vigor)"
    variables: [vigor]
    output: "1 to 1000000 Life"
    referenced_by: []
  - name: combat_hit
    status: active
    source: design/gdd/combat-resolver.md
    expression: "1 if might + guard = 0, else max(1, div_floor(might^2, might + guard))"
    variables: [might, guard]
    output: "1 to 1000000 Life per strike"
    referenced_by: []
  - name: combat_rate
    status: active
    source: design/gdd/combat-resolver.md
    expression: "SPEED_BASE + speed"
    variables: [speed, SPEED_BASE]
    output: "SPEED_BASE to 1000000 + SPEED_BASE strikes per time unit"
    referenced_by: []
  - name: combat_strikes_needed
    status: active
    source: design/gdd/combat-resolver.md
    expression: "div_floor(L + hit - 1, hit)"
    variables: [L, hit]
    output: "1 to 1000000 strikes"
    referenced_by: []
  - name: combat_won
    status: active
    source: design/gdd/combat-resolver.md
    expression: "n(C->F) * rate(F) <= n(F->C) * rate(C); tie goes to the challenger"
    variables: [n_challenger, n_opponent, rate_challenger, rate_opponent]
    output: "boolean"
    referenced_by: []
  - name: combat_life_left
    status: active
    source: design/gdd/combat-resolver.md
    expression: "win: L_C - div_floor(n(C->F) * rate(F) - 1, rate(C)) * hit(F->C); loss: L_F - div_floor(n(F->C) * rate(C), rate(F)) * hit(C->F)"
    variables: [L_C, L_F, n_challenger, n_opponent, rate_challenger, rate_opponent, hit_challenger, hit_opponent]
    output: "1 to starting Life of the winner"
    referenced_by: []
  - name: combat_score
    status: active
    source: design/gdd/combat-resolver.md
    expression: "win: 10000 + div_floor(life_end_C * 10000, L_C); loss: div_floor((L_F - life_end_F) * 10000, L_F)"
    variables: [life_end_C, L_C, life_end_F, L_F]
    output: "loss 0 to 9999; win 10000 to 20000; monotone in every stat"
    referenced_by: []
  - name: effective_cap
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "cap(id) = final value of (id, cap) in effective(set_m, F, none) (#2 M4) for a resource; INGREDIENT_HELD_MAX for an ingredient"
    variables: [base, F, INGREDIENT_HELD_MAX]
    output: "1 to 10^9; the base cap before the forge, then the base cap or a value in raise_envelope"
    referenced_by: []
  - name: settle
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "throws unless in <= held (checked before netting); raw = held - in + out; held' = min(raw, cap); lost = raw - held'"
    variables: [held, in, out, cap]
    output: "held' 0 to cap; lost 0 to out for a unit, 0 to held - cap for a re-clamp; marks update once after the call"
    referenced_by: []
  - name: start_held
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "held0 = min(start, cap) for a resource; 0 for an ingredient"
    variables: [start, cap]
    output: "0 to cap; marks start at held0"
    referenced_by: []
  - name: room
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "room = cap - held; full = (room = 0)"
    variables: [cap, held]
    output: "0 to cap"
    referenced_by: []
  - name: raise_envelope
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "lo(b) = max(b + 1, ceil_div(b * RAISE_MIN_BP, 10000)); hi(b) = div_floor(b * RAISE_MAX_BP, 10000); pass if E = b or lo <= E <= hi (b >= 2); E = 1 and no entry for b = 1"
    variables: [b, E, RAISE_MIN_BP, RAISE_MAX_BP]
    output: "bool; hi >= lo for every b >= 2"
    referenced_by: []
  - name: bill_share
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "share_bp(r) = div_floor(B(r) * 10000, b(r)); B(r) = largest inputs amount of r over sources"
    variables: [B, b]
    output: "1 and up; V2 passes from BILL_FLOOR_BP to 10000"
    referenced_by: []
  - name: first_cap
    status: active
    source: design/gdd/resources-and-caps.md
    expression: "fill_units = ceil_div(b - start, out); ok = start < b AND fill_units <= div_floor(FIRST_CAP_MS, duration)"
    variables: [b, start, out, duration, FIRST_CAP_MS]
    output: "bool; forms no units-times-duration product"
    referenced_by: []
  - name: rest_bank
    status: active
    source: design/gdd/activity-slot-rest-and-away-time.md
    expression: "budget = running ? dt + min(dt, b) : 0; used = min(budget, A_stop); b' = min(BANK_CAP, b + dt - used); t' = t + used"
    variables: [dt, b, running, A_stop, t, BANK_CAP]
    output: "b' 0 to BANK_CAP; used 0 to 2 dt; from run start sum(used) + b <= sum(dt) (activity time never exceeds real time); composes exactly"
    referenced_by: []
  - name: progress_rescale
    status: active
    source: design/gdd/activity-slot-rest-and-away-time.md
    expression: "p' = div_floor(p * D', D), on a recompute during play only (never on load)"
    variables: [p, D, D']
    output: "0 <= p' < D'; never gains; product at most 86400000^2"
    referenced_by: []
  - name: run_unit_bound
    status: active
    source: design/gdd/activity-slot-rest-and-away-time.md
    expression: "units_max = 1 + ceil((AWAY_CAP - 1) / UNIT_FLOOR_MS)"
    variables: [AWAY_CAP, UNIT_FLOOR_MS]
    output: "86401 with the provisional constants; at most UNITS_MAX (T3)"
    referenced_by: []
  - name: units_to_stop
    status: active
    source: design/gdd/activity-slot-rest-and-away-time.md
    expression: "U = min over ids of u; net = out - in; u = 0 if held < in; div_floor(held - in, -net) + 1 if net < 0; ceil(room / net) if net > 0 and an output; else infinity"
    variables: [held, in, out, room]
    output: "0 to infinity units; a read-only projection, never used to skip units"
    referenced_by: []
  - name: eta
    status: active
    source: design/gdd/activity-slot-rest-and-away-time.md
    expression: "eta(r, b) = r <= 2b ? ceil(r / 2) : r - b"
    variables: [r, b]
    output: "0 to r real ms; pacing ceilings read b = 0, floors b = BANK_CAP"
    referenced_by: []
  - name: affinity_total
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "T_a = sum over makeup ingredients i of contrib_m[i][a]"
    variables: [contrib_m, a]
    output: "-4,000,000 to 4,000,000 per affinity (N = 4)"
    referenced_by: []
  - name: effective_affinity
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "e_a = max(0, max(0, T_a) - div_floor(max(0, T_opp(a)) * CLASH_BP, 10000)); opposed pairs might-vigor (Cinder-Bark), guard-speed (Jade-Gale)"
    variables: [T_a, T_opp, CLASH_BP]
    output: "0 to T_a positive part"
    referenced_by: []
  - name: foundation_stat
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "stat_a = min(1000000, FOUNDATION_BASE_a + e_a)"
    variables: [FOUNDATION_BASE_a, e_a]
    output: "0 to 1,000,000; speed capped at SPEED_BASE by B11"
    referenced_by: []
  - name: door_tier
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "tier = [score >= t1] + [score >= t2]"
    variables: [score, t1, t2]
    output: "0, 1 or 2; a lost fight is always 0"
    referenced_by: []
  - name: seals
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "seals(makeup, m) = sum over doors of tier_d; bestSeals(m) = max over makeups of seals"
    variables: [tier_d, doors]
    output: "0 to 2 x doors (0-6 in the MVP); B6 makes the maximum unreachable"
    referenced_by: []
  - name: foundation_cap_raise
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "w(r) = sum of e_a over affinities listing r; E = b if w = 0, else lo(b) + div_floor((hi(b) - lo(b)) * min(w, WIDEN_FULL), WIDEN_FULL); D = E - b split per ingredient by cumulative rounding of positive contrib in id order"
    variables: [e_a, b, lo, hi, WIDEN_FULL, contrib_m]
    output: "E = b or lo(b) to hi(b); lines sum to D, each >= 0, at most N per store"
    referenced_by: []
  - name: gather_time
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "T(X, m) = sum over sources s used by the chains of X of ceil_div(D_s(X), out_s) * d_s; shared inputs made once; no by-product credit"
    variables: [X, D_s, out_s, d_s]
    output: "0 ms upward; B9 needs T_all >= 1.35 x T_best, +6 min, <= 60 min"
    referenced_by: [design/gdd/methods.md, design/gdd/crafting-route.md, design/gdd/fight-and-dungeon-routes.md]
  - name: source_price
    status: active
    source: design/gdd/forge-and-proving.md
    expression: "price(s) = d_s + sum over inputs r of ceil_div(in_s[r], out_r) * price(src(r)) + sum of reached-atom prices; ceiling(i) = max(div_floor(p_i * FIGHTLESS_CEILING_BP, 10000), p_i + FIGHTLESS_SLACK_MS)"
    variables: [d_s, in_s, out_r, p_i, FIGHTLESS_CEILING_BP, FIGHTLESS_SLACK_MS]
    output: "1 ms upward; B10 passes when the cheapest fightless price <= ceiling"
    referenced_by: [design/gdd/methods.md, design/gdd/crafting-route.md, design/gdd/fight-and-dungeon-routes.md]
  - name: gives_up
    status: active
    source: design/gdd/methods.md
    expression: "givesUp(m) = for each method o != m in id order: o, then opened(o) in id order, where opened(o) = sources s with (s, enabled) in changed(o); each prints as Closes: {name}"
    variables: [m, o, opened]
    output: "(M - 1) x (1 + |opened(o)|) lines; 4 in the MVP"
    referenced_by: [design/gdd/content-records-and-schema.md]
  - name: redo_line
    status: active
    source: design/gdd/methods.md
    expression: "redoLine(m) = Redo: only by starting a new run, if redoCost is absent; else Redo: {duration(redoCost)} to change method"
    variables: [redoCost, duration]
    output: "one line; the number only from the field"
    referenced_by: [design/gdd/content-records-and-schema.md]
  - name: route_count
    status: active
    source: design/gdd/methods.md
    expression: "routes(i, m) = number of enabled sources in set_m whose outputs hold ingredient i"
    variables: [i, m, enabled, outputs]
    output: "0 upward; #1 R8.4 needs >= 2; exactly 2 for all 12 pairs under the route plan"
    referenced_by: [design/gdd/fight-and-dungeon-routes.md]
  - name: price_leak
    status: active
    source: design/gdd/methods.md
    expression: "leak(m) = [T(best_m, m) <= min over makeups X of T(X, m)]; H5 fails when 1"
    variables: [T, best_m]
    output: "0 or 1; not evaluated when B1 fails"
    referenced_by: [design/gdd/crafting-route.md, design/gdd/fight-and-dungeon-routes.md]
  - name: hearth_gather_time
    status: active
    source: design/gdd/crafting-route.md
